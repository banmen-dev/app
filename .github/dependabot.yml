# 依存の更新を週に1回、ecosystem ごとに1つの PR にまとめて出す（docs/development.md の「定期の作業」）。
# PR は .github/labeler.yml の規則で needs-human が付き、人が差分を読んでマージする
version: 2
updates:
  # pnpm（package.json と pnpm-lock.yaml）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope
  # ワークフロー（.github/workflows/）と、自前の composite action（.github/actions/*/action.yml）が使う action
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
