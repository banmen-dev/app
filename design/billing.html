<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>請求管理者</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css"></head>
<body><main class="gate"><div class="gate-stack">
<section class="gate-sheet"><h1 class="gate-title">請求管理者</h1><p>業務利用とは別に、請求の担当者を管理します。ベータ中の契約変更・支払いは運用者に連絡してください。</p><label class="field">あなたのアカウントID<input class="input" readonly value="019aa222-1111-7000-8000-000000000001"></label><p class="field-hint">指名する人にこのIDを伝えてください。指名は本人が承諾するまで有効になりません。</p></section>
<section class="gate-sheet"><h2 class="dialog-title">届いた請求の指名</h2><p>青葉工房</p><div class="form-actions"><button class="btn is-primary">承諾する</button><button class="btn">辞退する</button></div></section>
<section class="gate-sheet"><h2 class="dialog-title">担当する組織</h2><a class="choice" href="#">青葉工房</a></section>
<section class="gate-sheet"><h2 class="dialog-title">青葉工房の請求管理者</h2><p>星野 澪 — 承諾済み</p><button class="btn">解除する</button><label class="field">指名する人のアカウントID<input class="input"></label><div class="form-actions"><button class="btn is-primary">指名する</button></div><p class="field-hint">契約中は最後の承諾済み担当者を解除できません。新しい担当者の承諾を待ってから解除してください。</p><h2 class="dialog-title">担当者の変更履歴</h2><p>2026-11-15T00:00:00.000Z 指名を承諾</p></section>
<section class="gate-sheet"><h2 class="dialog-title">最初の請求管理者を指名</h2><p>運用者だけの操作。利用する組織管理者とは別に指名します。</p><label class="field">組織のslug<input class="input"></label><label class="field">指名する人のアカウントID<input class="input"></label><button class="btn">指名する</button></section>
</div></main></body></html>
