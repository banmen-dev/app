<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrum Guild 今日やること</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// 今日やること（組織のホーム）: 2列のダッシュボード。左の列に、所属するワークスペースの面と、自分が担当するタスクの面（今日やること）、Scrum Guild のニュースの面を上から並べる。
// 右の列（.dashboard-side）は面（最近の更新）を足すまで置かない。広い幅では右の列の幅だけが空く（左3、右2）
const { D, t, book, section, foldedSection, pageHead, sprintNotice, pane, paneList, newsList, dashboard } = SQ;

SQ.mount("today", () => {
  const mine = SQ.tasksWhere((x) => x.who === D.me);
  const open = mine.filter((x) => !x.doneAt);
  const dueDate = (x) => SQ.dueOf(x)?.date ?? null;
  const byDue = (a, b) => (dueDate(a) ?? "9999").localeCompare(dueDate(b) ?? "9999");
  const isOverdue = (x) => dueDate(x) !== null && dueDate(x) < D.today;
  const inWeek = (x) => dueDate(x) !== null && dueDate(x) >= D.today && dueDate(x) <= D.weekEnd;
  const carryDays = (x) => {
    if (!x.todayOn || x.todayOn >= D.today) return 0;
    return Math.round((Date.parse(`${D.today}T00:00:00Z`) - Date.parse(`${x.todayOn}T00:00:00Z`)) / 86400000);
  };
  // 印を付けたものは、期日に関わらず「今日やると決めたもの」だけに出す。持ち越しを先頭にまとめ、日数の多い順、同じなら期日の早い順
  const todayList = open.filter((x) => x.todayOn).sort((a, b) => carryDays(b) - carryDays(a) || byDue(a, b));
  const overdueList = open.filter((x) => !x.todayOn && isOverdue(x)).sort(byDue);
  const dueList = open.filter((x) => !x.todayOn && inWeek(x)).sort(byDue);
  const restList = open.filter((x) => !x.todayOn && !isOverdue(x) && !inWeek(x) && x.sprint && D.sprints[x.sprint].status === "active").sort(byDue);
  const doneList = mine.filter((x) => x.doneAt && x.doneAt.startsWith("10/20")).sort(byDue);
  const opts = { showWs: true, meta: (x) => carryDays(x) ? `<span class="props-note">${carryDays(x)} 日前に印を付けた</span>` : "" };
  const hasWs = Object.keys(D.workspaces).length > 0;
  const active = Object.keys(D.sprints).filter((id) => D.sprints[id].status === "active");
  const todayEmpty = hasWs
    ? SQ.emptyState("sun", `今日やる${t("task")}はまだありません`,
        `${t("backlog")}や${t("sprint")}の行の左端にある太陽を押すと、ここに並びます。`,
        `<a class="btn is-sm" href="${SQ.firstHref("backlog.html")}">${t("backlog")}を開く</a>`, undefined, "sun")
    // ワークスペースが無いときの案内はワークスペースの面に出すので、ここは線画の無い短い1行にして案内を重ねない
    : `<div class="book"><div class="book-empty">${t("workspace")}に所属すると、自分が担当する${t("task")}がここに並びます。</div></div>`;
  // 今日やる以外の区分は、空なら出さない
  // 面の中の節なので、見出しは h3
  const part = (id, title, list) => (list.length ? section(id, title, list.length, book(list, opts), "", 3) : "");
  const dueOpts = { ...opts, meta: (x) => (dueDate(x) === D.today ? '<span class="chip is-warn">期日は今日</span>' : "") };
  // ワークスペースの面。所属するワークスペースを名前とロールで並べ、押すとバックログへ移る。所属が無いときは最初のワークスペースを作る案内
  const workspaceBody = hasWs
    ? paneList(Object.keys(D.workspaces).map((id) => ({ href: `backlog.html?workspace=${encodeURIComponent(id)}`, name: D.workspaces[id].name, role: D.workspaces[id].role })))
    : SQ.emptyState("sun", `まだ${t("workspace")}がありません`, `最初の${t("workspace")}を作ります。最初の${t("leader")}を1人決めて作ります。`,
        `<button class="btn is-sm" type="button">${SQ.icon("plus")}${t("workspace")}を作る</button>`, undefined, "map");
  const workspacePane = pane("p-workspaces", t("workspace"), workspaceBody, { count: hasWs ? Object.keys(D.workspaces).length : null, hint: hasWs ? t("workspacePaneHint").replace("{backlog}", t("backlog")) : "" });
  const todayPane = pane("p-today", "今日やること", `
        ${active.length ? `<div class="notice-grid">${active.map((id) => sprintNotice(id)).join("")}</div>` : ""}
        ${part("s-overdue", `${t("due")}切れ`, overdueList)}
        ${section("s-today", "今日やると決めたもの", todayList.length || null, book(todayList, { ...opts, empty: todayEmpty }), "印を付けた日が過ぎても、完了にするか印を外すまで残ります", 3)}
        ${dueList.length ? section("s-due", `今週が${t("due")}`, dueList.length, book(dueList, dueOpts), "", 3) : ""}
        ${restList.length ? foldedSection("s-sprint", `進行中の${t("sprint")}`, restList.length, book(restList, opts), 3) : ""}
        ${part("s-done", t("doneToday"), doneList)}`);
  // ニュースの面。新しい順に5件まで。1件も無いときは面を置かない
  const newsPane = D.news.length ? pane("p-news", t("paneNews"), newsList(D.news)) : "";
  // 見出しと「最初にやること」を全幅で置き、その下にダッシュボード。積載量は #66 で今日やるの近くに足す。
  return `${pageHead(D.todayLabel, "今日やること", [
        ["", "sun", "今日やると決めたもの", todayList.length],
        ["is-danger", "alert", `${t("due")}切れ`, overdueList.length],
        ["is-warn", "clock", `今週が${t("due")}`, dueList.length],
        ["is-ok", "check", "取り込み元で完了", open.filter((x) => x.srcDone).length],
        ["", "check", t("doneToday"), doneList.length],
      ])}
    <div class="layout-main">
      ${SQ.first ? SQ.firstSteps(SQ.first) : ""}
      ${dashboard(workspacePane + todayPane + newsPane)}
    </div>
  `;
});
</script>
</body>
</html>
