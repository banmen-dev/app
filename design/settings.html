<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banmen 設定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script src="task-templates.js"></script>
<script>
"use strict";
// ワークスペースの設定（リーダーと管理者）
const { D, t, icon, esc, pageHead } = SQ;
const TZ = ["Asia/Tokyo", "Asia/Seoul", "Asia/Singapore", "Europe/London", "America/Los_Angeles", "UTC"];
const WEEK = ["日", "月", "火", "水", "木", "金", "土"];
const workspace = D.workspaces[D.workspace];
const isAdmin = D.organizations.some((org) => org.slug === D.organization && org.admin);
const query = new URLSearchParams(location.search);
if (query.get("closed") === "1") workspace.closed = "2026-10-22";

function workspaceStateSetting() {
  if (!isAdmin) return "";
  const name = esc(workspace.name);
  const closed = Boolean(workspace.closed);
  return setting(`${t("workspace")}の利用状態`, "終了中も閲覧できます。更新と外部サービスとの同期は止まります。", `
    <div class="form-actions"><button class="btn" id="workspace-state" type="button"
      aria-label="「${name}」を${closed ? "再開する" : "終了する"}"
      ${closed ? "data-reopen-workspace" : `data-dialog="closeWorkspace" data-workspace-name="${name}"`}>${closed ? "再開する" : "終了する"}</button></div>`);
}

document.addEventListener("click", (event) => {
  if (!event.target.closest("[data-confirm-workspace-close], [data-reopen-workspace]")) return;
  workspace.closed = workspace.closed ? null : "2026-10-22";
  SQ.redraw();
  document.getElementById("workspace-state").focus();
  SQ.toast(`${icon("check")}${t("workspace")}を${workspace.closed ? "終了" : "再開"}しました`);
});

function orderList(items, opts = {}) {
  const n = items.length;
  return `<ol class="order-list">${items.map((it, i) => `<li>
      <span class="grip" aria-hidden="true">${icon("grip")}</span>
      ${typeof it === "string" ? `<input class="input" value="${esc(it)}" aria-label="名前">` : it.html}
      <span class="order-actions">
        <button class="icon-btn" type="button" aria-label="上へ" ${i === 0 ? "disabled" : ""}>${icon("up")}</button>
        <button class="icon-btn" type="button" aria-label="下へ" ${i === n - 1 ? "disabled" : ""}>${icon("down")}</button>
        <button class="icon-btn is-danger" type="button" aria-label="削除" ${opts.lockLast && n === 1 ? "disabled" : ""}>${icon("trash")}</button>
      </span></li>`).join("")}
    ${opts.fixed ? `<li><span class="grip is-off" aria-hidden="true"></span><span class="fixed">${opts.fixed}</span><span class="props-note">常に末尾</span></li>` : ""}
  </ol>`;
}
function setting(title, desc, body) {
  return `<section class="setting"><div class="setting-head"><h2 class="setting-title">${title}</h2><p class="setting-desc">${desc}</p></div><div class="setting-body">${body}</div></section>`;
}

function readOnlySettings() {
  const list = (values) => `<ol class="order-list">${values.map((value) => `<li><span>${esc(value)}</span></li>`).join("")}</ol>`;
  return `
    ${setting(t("column"), `${t("sprint")}の${t("column")}`, list(D.columns.map((column) => column.name)))}
    ${setting(`${t("detail")}の決まった欄`, `${t("task")}ごとに書く欄。`, list(D.detailFields))}
    ${setting(t("sprintNamingTitle").replace("{sprint}", t("sprint")), t("sprintNamingDesc").replace("{sprint}", t("sprint")), `
      <div class="field"><span class="field-label">${t("sprintNamingTemplate")}</span><div class="doc-box is-plain">${t("sprint")}{n}</div></div>
      <div class="field"><span class="field-label">${t("sprintNamingNumber")}</span><div class="doc-box is-plain">12</div></div>`)}
    ${setting(t("dod"), `すべての${t("task")}に共通する完了の基準。`, list(D.definitionOfDone))}
    ${setting(t("category"), `${t("epic")}に振ると配下が引き継ぎます。`, list(Object.values(D.categories).map((category) => category.name)))}
    ${setting("リポジトリ", `${t("task")}がどのリポジトリの作業かを示します。`, list(Object.values(D.repositories).map((repository) => repository.name)))}
  `;
}

function workspaceDeleteSetting() {
  if (!isAdmin) return "";
  const workspaceLabel = t("workspace");
  return setting(`${workspaceLabel}の削除`, `削除した${workspaceLabel}は開けなくなり、再開もできません。`,
    workspace.closed
      ? '<div class="form-actions"><button class="btn is-danger" type="button" data-workspace-delete>削除する</button></div>'
      : `<p class="field-hint">削除するには、先にこの${workspaceLabel}を終了してください。 <a href="#workspace-state">利用状態へ移動</a></p>`);
}

function showWorkspaceDelete(state) {
  const name = workspace.name;
  const workspaceLabel = t("workspace");
  const sending = state === "sending";
  const failed = state === "failed";
  const sendingControl = sending ? 'aria-disabled="true"' : 'data-close-dialog';
  SQ.openDialog(`「${esc(name)}」を削除しますか？`,
    `<p>削除すると、この${workspaceLabel}と中のデータは開けなくなります。削除は取り消せません。</p>
    <p>添付ファイルと Wiki は引き続き容量に含まれます。削除した${workspaceLabel}内では個別に消せなくなるため、容量を空けたい場合は、${workspaceLabel}を再開し、不要な添付ファイルと Wiki ページを先に削除してください。削除した Wiki ページは30日間、容量に含まれます。</p>
    <form id="workspace-delete-form"><div class="field" id="workspace-delete-field">
      <label class="field-label" for="workspace-delete-name">${workspaceLabel}名</label>
      <input class="input" id="workspace-delete-name" aria-describedby="workspace-delete-hint" autocomplete="off" spellcheck="false" value="${sending || failed ? esc(name) : ""}" ${sending ? "readonly" : ""}>
      <span class="field-hint wrap-anywhere" id="workspace-delete-hint">確認のため「${esc(name)}」と入力してください。</span>
      <span class="field-error" id="workspace-delete-mismatch" hidden>${icon("alert")}入力が${workspaceLabel}名と一致していません。</span>
    </div></form>
    ${failed ? `<div class="callout is-danger" role="alert">${icon("alert")}<span>${workspaceLabel}を削除できませんでした。もう一度試してください。</span></div>` : ""}`,
    `<span class="field-hint" role="status">${sending ? "削除しています" : ""}</span>
    <button class="btn is-primary" type="button" ${sendingControl}>やめる</button>
    <button class="btn is-danger" type="submit" form="workspace-delete-form" ${sending ? 'aria-disabled="true"' : failed ? "" : "disabled"}>削除する</button>`,
    sending);
  const form = document.getElementById("workspace-delete-form");
  const input = document.getElementById("workspace-delete-name");
  const field = document.getElementById("workspace-delete-field");
  const mismatchMessage = document.getElementById("workspace-delete-mismatch");
  const submit = document.querySelector('button[form="workspace-delete-form"]');
  const sheet = form.closest(".dialog-sheet");
  sheet.classList.add("is-danger");
  if (sending) {
    const close = sheet.querySelector("[data-close-dialog]");
    close.removeAttribute("data-close-dialog");
    close.setAttribute("aria-disabled", "true");
  }
  let composing = false;
  let nameBlurred = false;
  function updateConfirmation() {
    const matches = input.value === name;
    const mismatch = !composing && input.value !== "" && !matches && (nameBlurred || !name.startsWith(input.value));
    field.classList.toggle("is-invalid", mismatch);
    mismatchMessage.hidden = !mismatch;
    input.setAttribute("aria-describedby", mismatch ? "workspace-delete-hint workspace-delete-mismatch" : "workspace-delete-hint");
    input.setAttribute("aria-invalid", String(mismatch));
    submit.disabled = composing || !matches;
  }
  input.addEventListener("input", updateConfirmation);
  input.addEventListener("compositionstart", () => {
    composing = true;
    updateConfirmation();
  });
  input.addEventListener("compositionend", () => {
    composing = false;
    updateConfirmation();
  });
  input.addEventListener("focus", () => {
    nameBlurred = false;
    updateConfirmation();
  });
  input.addEventListener("blur", () => {
    nameBlurred = true;
    updateConfirmation();
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && (composing || event.isComposing || event.keyCode === 229)) event.preventDefault();
  });
  form.addEventListener("submit", (submitEvent) => {
    submitEvent.preventDefault();
    if (!sending && !composing && input.value === name) location.href = SQ.firstHref("today.html");
  });
}

document.addEventListener("click", (event) => {
  if (event.target instanceof Element && event.target.closest("[data-workspace-delete]")) showWorkspaceDelete();
});

SQ.mount("settings", () => `
  ${workspace.closed ? `<div class="callout is-info">${icon("archive")}<span>${esc(workspace.closed)} に終了しました。読み取り専用です。${isAdmin ? ' <a href="#workspace-state">設定で再開する</a>' : ""}</span></div>` : ""}
  ${pageHead({ narrow: workspace.name }, "設定", [], workspace.closed ? "" : `<button class="btn is-primary" type="button" data-toast="保存しました">保存する</button>`)}
  <div class="settings">
    ${workspaceStateSetting()}
    ${workspace.closed ? readOnlySettings() : `
    ${setting("一般", `今日、今週、完了した月は、ここのタイムゾーンで決めます。`, `
      <div class="form-row">
        <label class="field" for="wsname"><span class="field-label">名前</span><input class="input" id="wsname" value="${esc(D.workspaces.wa.name)}"></label>
        <label class="field" for="tz"><span class="field-label">タイムゾーン</span><select class="select" id="tz">${TZ.map((z) => `<option ${z === D.settings.timezone ? "selected" : ""}>${z}</option>`).join("")}</select></label>
      </div>
      <div class="field"><span class="field-label">週の始まり</span><div class="segmented" role="radiogroup">${WEEK.map((w, i) => `<label><input type="radio" name="ws" ${i === D.settings.weekStart ? "checked" : ""}><span>${w}</span></label>`).join("")}</div></div>`)}
    ${setting(t("column"), `${t("sprint")}の${t("column")}。名前は付けたままで、訳しません。${t("task")}が残っている${t("column")}を削除するときは移し先を選びます。`,
      orderList(D.columns.filter((c) => !c.done).map((c) => c.name), { fixed: `${icon("check")} ${t("done")}`, lockLast: true }) +
      `<div><button class="btn is-sm" type="button">${icon("plus")}${t("column")}を足す</button></div>`)}
    ${setting(`${t("detail")}の決まった欄`, `${t("task")}ごとに書く欄。`,
      orderList(D.detailFields) + `<div><button class="btn is-sm" type="button">${icon("plus")}欄を足す</button></div>`)}
    ${setting(t("sprintNamingTitle").replace("{sprint}", t("sprint")), t("sprintNamingDesc").replace("{sprint}", t("sprint")), `
      <div class="field"><label class="field-label" for="sprint-template">${t("sprintNamingTemplate")}</label><input class="input" id="sprint-template" value="${t("sprint")}{n}"><p class="field-hint">${t("sprintNamingHint")}</p></div>
      <div class="field"><label class="field-label" for="sprint-number">${t("sprintNamingNumber")}</label><input class="input" id="sprint-number" type="number" min="1" step="1" value="12"></div>
      <div class="doc-box"><ul>${["sprintNamingVariableN", "sprintNamingVariableYyyy", "sprintNamingVariableYy", "sprintNamingVariableMm", "sprintNamingVariableM", "sprintNamingVariableDd", "sprintNamingVariableD", "sprintNamingVariableW"].map((key) => `<li>${t(key)}</li>`).join("")}</ul></div>
      <p class="field-hint">${t("sprintNamingExample").replace("{date}", "2026-01-05").replace("{name}", `${t("sprint")}12`)}</p>
      <div class="form-actions"><button class="btn is-primary" type="button">${t("sprintNamingSave")}</button></div>
      <details><summary>状態の見本</summary>
        <div class="field is-invalid"><label class="field-label" for="sprint-template-error">${t("sprintNamingTemplate")}</label><input class="input" id="sprint-template-error" value="{unknown}" aria-invalid="true" aria-describedby="sprint-template-error-text"><span class="field-error" id="sprint-template-error-text">${icon("alert")}${t("sprintNamingUnknown")}</span></div>
        <div class="field is-invalid"><label class="field-label" for="sprint-number-error">${t("sprintNamingNumber")}</label><input class="input" id="sprint-number-error" type="number" value="0" aria-invalid="true" aria-describedby="sprint-number-error-text"><span class="field-error" id="sprint-number-error-text">${icon("alert")}${t("sprintNamingNumberInvalid")}</span></div>
        <div class="field"><label class="field-label" for="sprint-template-saving">${t("sprintNamingTemplate")}</label><input class="input" id="sprint-template-saving" value="${t("sprint")}{n}" readonly><span class="field-hint" role="status">${t("sprintNamingSaving")}</span><button class="btn is-primary" type="button" aria-disabled="true">${t("sprintNamingSave")}</button></div>
        <div class="field"><span class="field-label" id="sprint-readonly-template">${t("sprintNamingTemplate")}</span><div class="doc-box is-plain" role="note" aria-labelledby="sprint-readonly-template">${t("sprint")}{n}</div></div>
        <div class="field"><span class="field-label" id="sprint-readonly-number">${t("sprintNamingNumber")}</span><div class="doc-box is-plain" role="note" aria-labelledby="sprint-readonly-number">12</div></div>
        <p class="callout is-warn" role="note">${icon("alert")}${t("sprintNamingExpansionWarning").replace("{max}", "100")}</p>
        <p class="field-error">${icon("alert")}${t("sprintNamingLoadFailed")}</p>
        <button class="btn is-sm" type="button">${t("retry")}</button><span class="field-hint" role="status">${t("retryFailed")}</span>
        <div class="form-actions"><button class="btn is-primary" type="button">${t("sprintNamingSave")}</button><span class="field-hint" role="status">${t("sprintNamingUnchanged")}</span></div>
      </details>`)}
    ${SQTaskTemplates.canReadSettings() ? setting(t("taskTemplate"), `繰り返し使う${t("task")}の組を用意します。`, SQTaskTemplates.settings()) : ""}
    ${setting(t("dod"), `すべての${t("task")}に共通する完了の基準。${t("backlog")}の上と、完了の操作の横に出します。`, `
      <div class="field"><label class="field-label" for="dod">Markdown</label><textarea class="textarea" id="dod" rows="8" aria-describedby="dod-hint">${D.definitionOfDone.map((d) => `- ${esc(d)}`).join("\n")}</textarea>
        <span class="field-hint" id="dod-hint">Markdown で書けます。空にして保存すると、どこにも出しません。</span>
        <div class="form-actions"><button class="btn is-primary" type="button" aria-disabled="true">保存する</button></div></div>`)}
    ${setting(t("category"), `${t("epic")}に振ると配下が引き継ぎます。「月ごとに計上する」${t("category")}は、完了の記録に計上月を持ちます。`,
      orderList(Object.values(D.categories).map((c) => ({ html: `<span class="order-main"><input class="input" value="${esc(c.name)}" aria-label="名前"><label class="toggle"><input type="checkbox" ${c.monthly ? "checked" : ""}><span>月ごとに計上する</span></label></span>` }))) +
      `<div><button class="btn is-sm" type="button">${icon("plus")}${t("category")}を足す</button></div>`)}
    ${setting("リポジトリ", `${t("task")}がどのリポジトリの作業かを示します。${t("task")}に1つまで振れ、行のチップかタスクの詳細で選びます。取り込み元の入る先を結ぶと、そこから取り込んだ${t("task")}に自動で振ります。`,
      orderList(Object.values(D.repositories).map((r) => ({ html: `<span class="order-main"><input class="input" value="${esc(r.name)}" aria-label="名前"><select class="select" aria-label="結ぶ取り込み元の入る先"><option ${r.source ? "" : "selected"}>結ばない</option>${D.connections.filter((c) => c.provider === "github").flatMap((c) => c.scope.items).map((it) => `<option ${it === r.source ? "selected" : ""}>${esc(it)}（GitHub）</option>`).join("")}</select></span>` }))) +
      `<div><button class="btn is-sm" type="button">${icon("plus")}リポジトリを足す</button></div>`)}
    ${setting(`${t("points")}の換算`, `${t("capacity")}で、${t("points")}を時間に直す比率。適用を始める月を付けて変えるので、過去の月の値は動きません。`, `
      <div class="form-row">
        <label class="field" for="rate"><span class="field-label">1 ${t("points")} あたり（時間）</span><input class="input" id="rate" type="number" value="4" min="0.5" step="0.5"></label>
        <label class="field" for="rate-from"><span class="field-label">適用を始める月</span><input class="input" id="rate-from" value="2026-11"></label>
      </div>
      <div class="table-wrap"><table class="table"><thead><tr><th>適用を始めた月</th><th class="is-num">1 ${t("points")}</th></tr></thead><tbody>${D.pointRates.map(([m, h]) => `<tr><td class="mono">${m}</td><td class="is-num">${h} 時間</td></tr>`).join("")}</tbody></table></div>`)}
    ${setting(`${t("workspace")}の休日`, `この${t("workspace")}だけの休日。組織の休日（祝日など）は管理者が登録します。`, `
      <ul class="party-list">${D.workspaceHolidays.map(([d, n]) => `<li><span class="mono">${d}</span><span class="party-list-text">${esc(n)}</span><button class="icon-btn is-danger party-list-end" type="button" aria-label="${d} を消す">${icon("trash")}</button></li>`).join("")}</ul>
      <div class="form-row"><label class="field" for="hd"><span class="field-label">日付</span><input class="input" id="hd" type="date"></label><label class="field" for="hn"><span class="field-label">名前</span><input class="input" id="hn"></label><button class="btn" type="button">足す</button></div>`)}
    `}
    ${workspaceDeleteSetting()}
  </div>`);
</script>
</body>
</html>
