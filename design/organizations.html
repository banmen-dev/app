<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banmen ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="gate"></div>
<div class="dialog" id="dialog" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";

// 全組織のダッシュボード。組織が1つでもログインの直後に出す。左の列は自分用、組織（組織ごとのワークスペース）、全組織の今日やること、
// 届いた招待、停止している組織。右の列は全組織の最近の更新とニュース。
const { D, t, esc, icon, pane, newsList, entry, section, foldedSection } = SQ;
// 届いた招待の紙。承諾待ちの招待がある人に出す。入れる組織の分も含め、組織ごとに1件
const invitationsSheet = () => pane("p-invitations", "届いた招待", `
      <div class="choice-list">
      ${[...new Set(D.receivedInvites.map((i) => i.organization))].map((name) => `<a class="choice" href="login.html"><div>
        <b>${esc(name)}</b>
        <span>承諾待ちの招待があります</span></div>${icon("chevron")}
      </a>`).join("")}
      </div>
      <p class="gate-note">すべての${t("organization")}に届いた招待を、${t("organization")}ごとにまとめて出します。押すと、承諾するか辞退するかを選べます。見本は、その${t("organization")}の招待の画面（login.html の「届いた招待」）。</p>
    `);
// 停止している組織の紙。停止していなければ入れた組織があるときだけ、組織の選択の紙（届いた招待の紙があればその次）に出す。押せない行にする
const suspendedSheet = () => pane("p-suspended", `停止している${t("organization")}`, `
      <div class="choice-list">
        ${D.suspendedOrganizations.map((k) => `<div class="choice is-static"><div><b>${esc(k.name)}</b><span>停止しています</span></div></div>`).join("")}
      </div>
      <p class="gate-note">停止している${t("organization")}には、停止している間は入れません。再開については、運用者に問い合わせてください。</p>
    `);
const createActions = (primary) => `<button class="btn ${primary ? "is-primary" : "is-sm"}" type="button" data-dialog="createMyOrganization">${t("organization")}を作る</button><button class="btn is-sm" type="button" data-dialog="createPersonalOrganization">自分用を作る</button>`;
// 組織ごとのワークスペースの行（組織のホームのワークスペースの面と同じ .pane-list と .pane-link）。押すとバックログへ移る
const workspaceRows = (rows) => rows.length === 0
  ? `<p class="workspace-note">所属する${t("workspace")}はありません。</p>`
  : `<ul class="pane-list" aria-label="所属する${t("workspace")}">${rows.map((w) => `<li><a class="pane-link" href="backlog.html"><b>${esc(w.name)}</b><span class="pane-link-role">${t(w.role)}</span>${icon("chevron")}</a></li>`).join("")}</ul>`;
// 組織ごとの、自分が所属する閉じていないワークスペース（見本の値）
const dashboardWorkspaces = {
  aoba: [{ name: "受託開発チーム", role: "leader" }, { name: "社内ツール", role: "member" }],
  hibari: [],
};
// 自分用の面。組織の面と同じ枠に、自分用のホームへの行と自分用のワークスペースを並べ、最後に「ワークスペースを作る」を置く
const personalSheet = () => pane("p-personal", t("personalOrganizationName"), `
      <div class="org-block"><a class="choice" href="today.html"><div><b>${t("dashboardPersonalHome")}</b><span class="mono">banmen.ucan-lab.workers.dev/mio-solo/</span></div>${icon("chevron")}</a><div class="org-block-body">${workspaceRows([{ name: "読書の記録", role: "leader" }, { name: "家の用事", role: "leader" }])}</div></div>
      <div class="form-actions"><button class="btn is-sm" type="button" data-toast="見本のため、作りません">${icon("plus")}${t("workspace")}を作る</button></div>
    `);
// 組織の面。組織ごとの枠（.org-block）に、組織の行と、所属するワークスペースを並べる。読めなかった組織は短い案内にする
const organizationsSheet = () => pane("p-organizations", t("organization"), `
      <div class="org-blocks">
        ${D.organizations.map((k) => `<div class="org-block"><a class="choice" href="today.html"><div><b>${esc(k.name)}</b><span class="mono">banmen.ucan-lab.workers.dev/${esc(k.slug)}/</span></div>${icon("chevron")}</a><div class="org-block-body">${k.slug in dashboardWorkspaces ? workspaceRows(dashboardWorkspaces[k.slug]) : `<p class="workspace-note">${t("workspace")}を読み込めませんでした。組織のホームから開けます。</p>`}</div></div>`).join("")}
      </div>
      <p class="gate-note">あとから、画面の左上（狭い幅では上の帯）の${t("organization")}の切り替えで選び直せます。</p>
      <div class="form-actions"><button class="btn is-sm" type="button" data-dialog="createMyOrganization">${t("organization")}を作る</button></div>
    `);
// 全組織の最近の更新。行に組織の名前（自分用は「自分用」）の札を添え、押すとその組織の詳細へ移る
const activitySheet = () => pane("p-activity", t("paneActivity"), SQ.activity([
  { label: "2026年11月16日（月）", rows: [
    { href: "backlog.html", title: "第3章を読む", text: "ミナトがコメントした", body: "半分まで読んだ。続きは週末に。", kind: "task", org: t("personalOrganizationName"), ws: "読書の記録", at: "2026-11-16T03:00:00.000Z", time: "12:00" },
    { href: "backlog.html", title: "見積もりを整える", text: "ハルカが期日を変更した", kind: "story", org: "あおば開発", ws: "受託開発チーム", at: "2026-11-16T02:00:00.000Z", time: "11:00" },
  ] },
  { label: "2026年11月15日（日）", rows: [
    { href: "backlog.html", title: "問い合わせの窓口を決める", text: "リンが作成した", kind: "task", org: "ひばり工房", ws: "社内ツール", at: "2026-11-15T08:00:00.000Z", time: "17:00" },
  ] },
], { more: true }));
// 本人の全組織の今日やること。行は閲覧だけで、その組織のバックログの詳細へ移る。
const myTodayEntry = (task, note = "") => {
  const organizationName = task.organization.kind === "personal" ? t("personalOrganizationName") : task.organization.name;
  // 本体の TaskEntry と同じ順（組織、ワークスペース）・同じ tag にする。
  const opts = { showWs: false, showParent: false, showAssignee: true, lead: '<span aria-hidden="true"></span>',
    actions: () => task.doneAt ? `<span class="hanko" role="img" aria-label="完了">${icon("check")}</span>` : "",
    meta: () => note };
  return entry(task, opts)
    .replace('<span class="entry-meta">', `<span class="entry-meta"><span class="tag">${esc(organizationName)}</span><span class="tag">${esc(D.workspaces[task.ws].name)}</span>`)
    .replace(`href="#" data-task="${task.id}"`, `href="backlog.html?workspace=${encodeURIComponent(task.ws)}&task=${encodeURIComponent(task.id)}"`);
};
const myTodaySheet = () => {
  const labels = ["期日切れ", "今日やると決めたもの", "依頼中", "今週が期日", "進行中のスプリント", "今日完了"];
  const rows = D.tasks.slice(0, 6).map((task, i) => ({ ...task, who: D.me, doneAt: i === 5 ? "10/20 14:00" : null,
    organization: D.organizations[i % D.organizations.length] }));
  const body = rows.map((task, i) => {
    const row = myTodayEntry(task, i === 2 ? '<span class="props-note">依頼先：青葉 透</span>' : "");
    const book = `<div class="book">${row}</div>`;
    return i === 4 ? foldedSection(`my-today-${i}`, labels[i], 1, book, 3) : section(`my-today-${i}`, labels[i], 1, book, "", 3);
  }).join("");
  return pane("p-my-today", "全組織の今日やること", body);
};
// 面だけの読み込み中・空・未読・部分失敗・全失敗。組織とニュースはそのまま残る。
const myTodayStates = () => {
  const title = "全組織の今日やること";
  const omitted = `<div class="callout is-info">${icon("alert")}<span>ほか 2 組織は読み込んでいません</span></div>`;
  const failedName = "ひばり工房・共同制作と長い名前の折り返しを確かめる組織";
  const task = { ...D.tasks[0], who: D.me, doneAt: null, organization: D.organizations[0] };
  const states = [
    { name: "読み込み中", id: "loading", busy: true,
      body: '<div class="skeleton" aria-hidden="true"><span class="skeleton-line is-block"></span><span class="skeleton-line is-block"></span><span class="skeleton-line is-block"></span></div>',
      note: "my-today を面の中で読み、組織の入口とニュースは先に表示します。" },
    { name: "今日やることが無い", id: "empty",
      body: '<p class="book-empty">今日やることはまだありません。各組織のバックログから探せます。</p>' },
    { name: "上限の先に未読の組織がある", id: "omitted",
      body: `${omitted}<p class="book-empty">読み込んだ組織には今日やることがありません。</p>`,
      note: "先頭10組織だけを読んでいるため、全組織にタスクが無いとは案内しません。" },
    { name: "一部の組織だけ読めなかった", id: "partial",
      body: `<div class="choice-list"><a class="choice" href="today.html"><div><b>${esc(failedName)}</b><span>今日やることを読めませんでした</span></div>${icon("chevron")}</a></div>${section("my-today-partial-today", "今日やると決めたもの", 1, `<div class="book">${myTodayEntry(task)}</div>`, "", 3)}`,
      note: "読めた組織の分は残します。読めなかった組織も、折り返す押せる行でホームへ移れます。" },
    { name: "読み込みに失敗した", id: "failed",
      body: `<div class="callout is-warn">${icon("alert")}<span role="alert">今日やることを読み込めませんでした</span></div><div class="form-actions"><button class="btn" type="button" data-toast="見本のため、読み込み直しません">もう一度試す</button><span class="field-hint" role="status"></span></div>`,
      note: "再試行はこの面だけを読み直します。組織の一覧とニュースは残します。" },
  ];
  return states.map((state) => `<section class="gate-sheet"><h2 class="dialog-title">全組織の今日やること：${state.name}</h2>${pane(`p-my-today-${state.id}`, title, state.body, { busy: state.busy ?? false })}${state.note ? `<p class="gate-note">${state.note}</p>` : ""}</section>`).join("");
};
function render() {
  document.getElementById("gate").innerHTML = `<div class="gate is-wide"><div class="gate-stack">
    <section class="gate-sheet">
      <div class="gate-brand">${SQ.brandMark}<span class="visually-hidden">Banmen</span></div>
      <h1 class="gate-title">${t("organizationList")}</h1>
      <div class="dashboard"><div class="dashboard-main">
      ${personalSheet()}
      ${organizationsSheet()}
      ${myTodaySheet()}
      ${invitationsSheet()}
      ${suspendedSheet()}
      </div><div class="dashboard-side">${activitySheet()}${D.news.length ? pane("p-news", t("paneNews").replace("{app}", t("appName")), newsList(D.news)) : ""}</div></div>
      <div class="form-actions"><a class="btn is-sm" href="billing.html">${t("billingOpen")}</a><button class="btn is-sm is-quiet" type="button" data-toast="見本のため、ログアウトしません">${t("logout")}</button></div>
    </section>
    <section class="gate-sheet">
      <h2 class="dialog-title">入れる${t("organization")}が無い人</h2>
      ${SQ.emptyState("shield", `入れる${t("organization")}がありません`, `${t("admin")}から招待が届くと、ここに出ます。自分で${t("organization")}を作って、30日間のお試しで始めることもできます。自分だけで使う「${t("personalOrganizationName")}」を作ることもできます。`,`<button class="btn is-primary" type="button" data-dialog="createMyOrganization">${t("organization")}を作る</button><button class="btn is-sm" type="button" data-dialog="createPersonalOrganization">自分用を作る</button>`)}
      <p class="gate-note">招待を待つほかに道が無いので、「${t("organization")}を作る」を主ボタンにし、「自分用を作る」は is-sm の副の大きさで隣に置く。</p>
    </section>
    <section class="gate-sheet">
      <h2 class="dialog-title">停止している${t("organization")}だけがある人</h2>
      ${SQ.emptyState("shield", `入れる${t("organization")}がありません`, `停止している${t("organization")}があります。下の「停止している${t("organization")}」を見てください。`, `<button class="btn is-sm" type="button" data-dialog="createMyOrganization">${t("organization")}を作る</button><button class="btn is-sm" type="button" data-dialog="createPersonalOrganization">自分用を作る</button>`)}
      <p class="gate-note">再開を待つ道があるので、「${t("organization")}を作る」は主ボタンにせず、一覧の下と同じ is-sm にそろえる。</p>
    </section>
    <section class="gate-sheet">
      <h2 class="dialog-title">招待だけが届いている人</h2>
      <p>まだ入れる${t("organization")}がありません。届いた招待から${t("organization")}を選び、承諾すると入れます。</p>
      <h3 class="dialog-title">届いた招待</h3>
      <div class="choice-list">
        <a class="choice" href="login.html"><div><b>ひばり工房</b><span>承諾待ちの招待があります</span></div>${icon("chevron")}</a>
      </div>
      <p class="gate-note">すべての${t("organization")}に届いた招待を、${t("organization")}ごとにまとめて出します。押すと、承諾するか辞退するかを選べます。</p>
      <div class="form-actions">${createActions(false)}</div>
      <div class="form-actions"><a class="btn is-sm" href="billing.html">${t("billingOpen")}</a><button class="btn is-sm is-quiet" type="button" data-toast="見本のため、ログアウトしません">${t("logout")}</button></div>
      <p class="gate-note">入れる${t("organization")}が無く、届いた招待だけがある人。押す先の招待を最初に出し、「${t("organization")}を作る」は下の静かな大きさ（is-sm）にそろえる。本番はこの全体が1枚目の組織の面に入る。</p>
    </section>
    <section class="gate-sheet">
      <h2 class="dialog-title">入れる${t("organization")}と停止している${t("organization")}がある人</h2>
      <div class="choice-list">
        ${D.organizations.map((k) => `<a class="choice" href="today.html"><div><b>${esc(k.name)}</b><span class="mono">banmen.ucan-lab.workers.dev/${esc(k.slug)}/</span></div>${icon("chevron")}</a>`).join("")}
      </div>
      <div class="form-actions">${createActions(false)}</div>
      <div class="form-actions"><a class="btn is-sm" href="billing.html">${t("billingOpen")}</a><button class="btn is-sm is-quiet" type="button" data-toast="見本のため、ログアウトしません">${t("logout")}</button></div>
      <p class="gate-note">停止している${t("organization")}は入れる${t("organization")}の一覧に並べず、リンクにしない。組織の面の下（届いた招待の面があればその次）に、別の面で出す。</p>
    </section>
    <section class="gate-sheet">
      <h2 class="dialog-title">運用者</h2>
      <div class="choice-list">
        ${D.organizations.map((k) => `<a class="choice" href="today.html"><div><b>${esc(k.name)}</b><span class="mono">banmen.ucan-lab.workers.dev/${esc(k.slug)}/</span></div>${icon("chevron")}</a>`).join("")}
      </div>
      <div class="form-actions">${createActions(false)}</div>
      <div class="form-actions"><a class="btn is-sm" href="billing.html">${t("billingOpen")}</a><a class="btn is-sm" href="operator.html">運用の画面へ</a><button class="btn is-sm is-quiet" type="button" data-toast="見本のため、ログアウトしません">${t("logout")}</button></div>
      <p class="gate-note">運用者には、ログアウトの隣に「運用の画面へ」を出す（運用者でない人には出さない）。</p>
    </section>
    <section class="gate-sheet">
      <h2 class="dialog-title">自分用の${t("organization")}を持たない人</h2>
      ${pane("p-personal-missing", t("personalOrganizationName"), `<p>自分だけで使う${t("workspace")}を置く「${t("personalOrganizationName")}」を作れます。期限はなく無料です。</p><div class="form-actions"><button class="btn is-sm" type="button" data-dialog="createPersonalOrganization">自分用を作る</button></div>`)}
      <p class="gate-note">チーム用の${t("organization")}に入れて、自分用を持たない人には、自分用の面に作る入口を置く（組織の面の下には「${t("organization")}を作る」だけ）。自分用（1アカウントに1つ）を持つ人には、自分用の面に自分用の${t("workspace")}と「${t("workspace")}を作る」を出し、「自分用を作る」は出さない（入れる${t("organization")}にも停止している${t("organization")}にも、自分用が無い人にだけ出す）。どちらの一覧にも出ない自分用を持つ人（その${t("organization")}で無効にされた人など）には出し、押すと 409 の <code>personal_limit</code> で断って、ダイアログが伝える。</p>
    </section>
    ${myTodayStates()}
    <p class="gate-note" style="text-align:center"><a href="index.html">デザインシステムのカタログへ戻る</a></p>
  </div></div>`;
}
SQ.applyTheme();
render();

</script>
</body>
</html>
