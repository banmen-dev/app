<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banmen エピック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// エピックの詳細
const { D, t, icon, esc, section, emptyState, pageHead, avatarOf, dueChip, progress, book, storyPts, attachments, filesOf } = SQ;
// 引き出しで直した見本も、移動先の画面へ渡す（本番のデータ保存は行わない）。
try {
  const preview = JSON.parse(sessionStorage.getItem("sq-design-epic-preview") || "null");
  if (preview && preview.id === new URLSearchParams(location.search).get("epic")) D.epics[preview.id] = preview.epic;
} catch { /* 覚えられない環境では既存の見本を使う */ }
const requestedEpic = new URLSearchParams(location.search).get("epic");
const ID = requestedEpic && Object.hasOwn(D.epics, requestedEpic) ? requestedEpic : "e1";

SQ.mount("epic", () => {
  const e = D.epics[ID];
  const p = SQ.epicPts(ID);
  const stories = Object.keys(D.stories).filter((s) => D.stories[s].epic === ID);
  // 完了にできるのは、配下のストーリーがすべて完了したとき
  const openStories = stories.filter((s) => !D.stories[s].doneAt).length;
  const allDone = stories.length > 0 && openStories === 0;
  return `
    ${pageHead(`${t("epic")}・${e.cat ? esc(D.categories[e.cat].name) : `${t("category")}なし`}`, esc(e.title), [
      ["", "check", `${t("done")}の${t("points")}`, p.done],
      ["", "", `残りの${t("points")}`, p.all - p.done],
    ], `<a class="btn is-sm is-quiet" href="backlog.html">${t("backlog")}へ戻る</a><a class="btn" href="?epic=${encodeURIComponent(ID)}&epic_id=${encodeURIComponent(ID)}" data-epic-id="${ID}">${icon("pen")}${t("epic")}を直す</a>`)}
    <div class="layout-aside">
      <div class="layout-main">
        <section class="section">
          <div class="epic-body">${(e.body || []).map((b) => `<p>${esc(b)}</p>`).join("")}
            ${e.link ? `<div><span class="source-key is-wrap">${icon("link")} ${esc(e.link)}</span> <a class="btn is-sm" href="#" aria-label="リンクを新しいタブで開く">開く</a></div>` : ""}</div>
          <div class="field"><span class="field-label">${icon("clip")} 添付ファイル ${filesOf(ID).length || ""}</span>${attachments(ID)}</div>
        </section>
        ${section("epic-stories", `配下の${t("story")}`, stories.length, stories.length ? `${stories.map((s) => {
          const st = D.stories[s];
          const sp = storyPts(s);
          const list = SQ.tasksWhere((x) => x.story === s);
          const openTasks = list.filter((x) => !x.doneAt).length;
          return `<section class="story-block" aria-labelledby="st-${s}">
            <div class="story-head"><span class="kind is-story">${icon("check")}</span><h3 class="story-title" id="st-${s}">${esc(st.title)}</h3>${progress(sp.done, sp.all)}</div>
            ${st.body ? `<div class="epic-body">${st.body.map((b) => `<p>${esc(b)}</p>`).join("")}</div>` : ""}
            <div class="ac-box"><b>${t("ac")}</b><ul>${st.ac.map((a) => `<li>${esc(a)}</li>`).join("")}</ul></div>
            ${attachments(s, { button: true })}
            ${book(list, { showParent: false, showAssignee: true })}
            <div class="form-actions">${st.doneAt
              ? `<span class="hanko" role="img" aria-label="${t("done")}">${icon("check")}</span><span>${t("done")} ${esc(st.doneAt)}</span><button class="link-btn" type="button" data-toast="完了を取り消しました">取り消す</button>`
              : `<button class="btn is-sm" type="button" ${openTasks ? "disabled" : ""}>${icon("check")}${t("story")}を${t("complete")}</button>${openTasks ? `<span class="action-note">配下の${t("task")}がすべて${t("done")}すると押せます（残り ${openTasks} 件）</span>` : ""}`}</div>
          </section>`;
        }).join("")}` : emptyState("flag", `${t("story")}はまだありません`))}
      </div>
      <aside class="layout-side is-static">
        <section class="panel">
          <div class="panel-title"><b>${t("epicPageRequest")}</b></div>
          <dl class="props">
            <div><dt>${t("requester")}</dt><dd>${avatarOf(e.requester)}${esc(SQ.user(e.requester).name)}</dd></div>
            <div><dt>${t("due")}</dt><dd>${dueChip(e.due)}</dd></div>
            <div><dt>${t("category")}</dt><dd>${e.cat ? esc(D.categories[e.cat].name) : `${t("category")}なし`}</dd></div>
          </dl>
        </section>
        <section class="panel" aria-labelledby="epic-clear">
          <div class="panel-title"><b id="epic-clear">${t("epic")}の${t("done")}</b></div>
          <p class="panel-note" id="epic-clear-note">${allDone
            ? `配下の${t("story")}はすべて${t("done")}になっています。${t("epic")}を${t("done")}にできます。`
            : stories.length === 0
              ? `${t("story")}が1件も無い${t("epic")}は、${t("done")}にできません。${t("story")}を足して、すべて${t("done")}にすると押せます。`
              : `未完了の${t("story")}が ${openStories} 件残っているあいだは、${t("done")}にできません。`}</p>
          <div class="actions-col">
            <button class="btn is-primary" type="button" aria-describedby="epic-clear-note" ${allDone ? "" : `aria-disabled="true"`}>${icon("check")}${t("clear")}</button>
          </div>
        </section>
      </aside>
    </div>`;
});
</script>
</body>
</html>
