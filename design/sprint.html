<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banmen ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div id="app"></div>
<script src="icons.js"></script>
<script src="art.js"></script>
<script src="sample-data.js"></script>
<script src="kit.js"></script>
<script>
"use strict";
// ボード: 進行中のスプリントの列とカード。見出しの下の1段の道具の帯の右端に、スプリントのボタンと小窓（#1498）
const { D, t, icon, pageHead, board, capacityRows, sumPts, progress } = SQ;

// ?overdue は、最終日を過ぎた進行中のスプリントの状態。ふだんの見本の最終日（10/26）の前に今日があるので、期間を1週間前へずらして今日が最終日より後になる形にする。
// 本番は SprintOverdueNotice.svelte で、進行中で、ワークスペースの今日が最終日より後のときに出す（ボードの小窓と計画の画面）
const params = new URLSearchParams(location.search);
const overdue = params.has("overdue");
const lastDay = params.has("last-day");
if (lastDay && D.sprints.sp14) D.sprints.sp14.dayIndex = D.sprints.sp14.days - 1;
if (overdue && D.sprints.sp14) {
  // 延長の注記と次のスプリントの期間も、ずらした期間に合わせる
  Object.assign(D.sprints.sp14, { start: "2026-10-06", end: "2026-10-19", dayIndex: D.sprints.sp14.days, extended: 0 });
  if (D.sprints.sp15) Object.assign(D.sprints.sp15, { start: "2026-10-20", end: "2026-11-02" });
}

// 最終日を過ぎた知らせ。終える人（リーダーと管理者）には「終える」を添えて終了のダイアログを開き、ほかの人には終えるのがリーダーだと伝える
function overdueNotice(id) {
  const label = SQ.sprintLabel(id);
  const end = SQ.md(D.sprints[id].end);
  const canClose = SQ.user(D.me).role === "leader";
  return `<div class="callout is-warn">${icon("alert")}<span>${canClose
    ? `${t("sprint")}「${label}」は最終日（${end}）を過ぎています。終わらなかった${t("task")}の行き先を決めて、終えてください。`
    : `${t("sprint")}「${label}」は最終日（${end}）を過ぎています。終えるのは${t("leader")}です。`}</span>${canClose
    ? `<div class="callout-actions"><button class="btn is-sm" type="button" data-dialog="sprintEnd" aria-label="終える: ${t("sprint")}「${label}」">終える</button></div>` : ""}</div>`;
}

SQ.mount("sprint", () => {
  const s = D.sprints.sp14;
  if (!s) {
    // 進行中のスプリントがない。作って始めるのはリーダー
    const isLeader = SQ.user(D.me).role === "leader";
    return `
      ${pageHead(D.workspaces.wa.name, t("board"))}
      ${SQ.emptyState("columns", `進行中の${t("sprint")}はありません`,
        isLeader
          ? `${t("plan")}の画面で${t("sprint")}を作り、${t("backlog")}から${t("task")}を入れてから始めます。始めると、ここに${t("column")}とカードが並びます。`
          : `${t("sprint")}を作って始めるのは${t("leader")}です。${t("sprint")}に入っていない${t("task")}も、${t("backlog")}から進めて完了にできます。`,
        isLeader
          ? `<a class="btn is-sm" href="${SQ.firstHref("plan.html")}">${t("plan")}を開く</a>`
          : `<a class="btn is-sm" href="${SQ.firstHref("backlog.html")}">${t("backlog")}を開く</a>`, "notice")}`;
  }
  const list = SQ.tasksWhere((x) => x.sprint === "sp14");
  const done = sumPts(list.filter((x) => x.doneAt)), all = sumPts(list);
  const label = SQ.sprintLabel("sp14");
  const day = Math.min(s.dayIndex + 1, s.days);
  const isLeader = SQ.user(D.me).role === "leader";
  // 道具の帯の右端のスプリントのボタンと小窓（本番の Popover。#1498）。期間、何日目か、延長、進み具合、残り、ゴールと、リーダーの操作を出す。
  // 最終日を過ぎたら、ボタンに警告の印を付け、小窓の先頭に終えるのを促す知らせを出す
  const actions = isLeader ? `<div class="popover-actions">
      <button class="btn is-sm" type="button" data-dialog="sprintEditActive" aria-label="${t("sprint")}を編集: ${SQ.esc(label)}">編集</button>
      <button class="btn is-sm" type="button" data-dialog="sprintExtend">延長する</button>
      <button class="btn is-sm" type="button" data-dialog="sprintEnd" aria-label="終える: ${t("sprint")}「${SQ.esc(label)}」">終える</button>
    </div>` : "";
  const panel = `${overdue ? overdueNotice("sp14") : ""}
    <div class="popover-head"><h2 class="popover-title">${SQ.esc(label)}</h2>
      <div class="popover-meta"><span>${SQ.md(s.start)}〜${SQ.md(s.end)}・${s.days} 日のうち ${day} 日目</span>${s.extended ? `<span>延長 ${s.extended} 日</span>` : ""}</div></div>
    <div class="progress-summary">${progress(done, all, { markerPercent: day / s.days * 100, markerLabel: `経過 ${day} / ${s.days} 日（${Math.round(day / s.days * 100)}%）`, detailed: true })}<span class="progress-remaining">残り ${Math.max(0, s.days - s.dayIndex)} 日</span></div>
    ${s.goal ? `<div class="popover-section"><span class="popover-label">${t("sprintGoal")}</span><p class="popover-text">${SQ.esc(s.goal)}</p></div>` : ""}
    ${actions}`;
  const sprintButton = SQ.popover(label, panel, {
    label: `${t("sprint")}の情報: ${label}${overdue ? "（最終日を過ぎています）" : ""}`,
    dialogLabel: `${t("sprint")}の情報`,
    icon: overdue ? "alert" : "clock",
    tone: overdue ? "warn" : "",
  });
  return `
    ${pageHead("", t("board"))}
    <div class="board-page">
      <div class="toolbar board-toolbar"><div class="toolbar-end">${sprintButton}</div></div>
      ${board("sp14", { draft: true, collapsed: (c) => c.done && new URLSearchParams(location.search).has("collapsed") })}
    </div>
    <span class="visually-hidden" id="board-key-hint">カードを別の${t("column")}へドラッグして移すか、カードを選んで Alt と ← → で隣の${t("column")}、Alt と ↑ ↓ で${t("column")}の中を動かせます。カードの「⋯」のメニューでも同じです。${t("done")}の${t("column")}の手前の${t("column")}から次へ送ると、${t("done")}になります。${t("done")}のカードは Alt と ← か「⋯」で戻せます。戻せないときは理由を知らせます。</span>
    <section class="section" aria-labelledby="cap">
      <div class="section-head"><h2 class="section-title" id="cap">この${t("sprint")}の${t("capacity")}</h2><span class="section-hint">1 ${t("points")} = ${D.hoursPerPoint} 時間・許容幅 ±12.5%</span></div>
      <div class="panel"><div class="grid-2">${capacityRows()}</div></div>
    </section>`;
});
</script>
</body>
</html>
